#Application name
spring.application.name=Test

#Logging configuration
#logging.level.root =DEBUG
logging.level.root=INFO
#logging.level.root = WARN
#logging.level.root =ERROR
#logging.level.root=FATAL


#To distinguish the output with colors
spring.output.ansi.enabled=always


#port number
server.port = ${SERVER_PORT:8080}


#Setting password for active user
spring.security.user.name= rku
spring.security.user.password= rku

#to enable/disable the dev-tool
spring.devtools.add-properties=false


#profile change
#spring.profiles.active=prod
#spring.profiles.active=dev


#---
#datasource details similar to application.yml
#spring.config.activate.on-profile=dev
spring.datasource.url= jdbc:mysql://${MYSQL_HOST:127.0.01}:${MYSQL_PORT:3306}/${MYSQL_DB:test}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username = ${MYSQL_USER:rku}
spring.datasource.password= ${MYSQL_PASSWORD:Localhost@1}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#---
#hibernate configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
