spring.application.name=Test

#Logging

#logging.level.root =DEBUG
logging.level.root=INFO
#logging.level.root = WARN
#logging.level.root =ERROR
#logging.level.root=FATAL

#To distinguish the output with colors
spring.output.ansi.enabled=always

#port number
server.port = 8080

#profile change
spring.profiles.active=prod
#spring.profiles.active=local

#Setting password for active user
spring.security.user.name= rku
spring.security.user.password= rku

#to enable/disable the dev-tool
spring.devtools.add-properties=false


#datasource details

#spring.datasource.url= jdbc:mysql://127.0.01:3306/test
#spring.datasource.username = rku
#spring.datasource.password= Localhost@1
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


#hibernate configuration

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false