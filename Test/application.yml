# To connect to the database we have to provide database definition configuration.
#  if other file like docker-compose have this same db configuration this yaml file will be ignored.
spring:
  datasource:
    url: jdbc:mysql://127.0.01:3306/test?useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: Localhost@1
    initialization-mode: always
  jpa:
    database-platform: org.hibernate.dialect.MySQL5Dialect
    hibernate:
      ddl-auto: update
